#CI de nivel 03 - Disparo após a conclusão de outra pipeline
#nome da pipeline
name: 'Execução por deploy'

#gatilho / triggers - regras de disparo
#gatilho manual = workflow_dispatch
#gatilho agendado = schedule
#gatilho após a conclusão de outra pipeline = workflow_run

on:
  workflow_run:
    workflows: ['Execução Manual', 'Schedule Execution']
    types:
      - completed
    push:
      branches:
        - master

#jobs - tarefas dentro da pipeline
jobs:
  #nome do job
  e2e-tests:
    #maquina onde o job vai rodar
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.46.0-jammy
    #condição para execução - somente se a pipeline anterior tiver sido concluída com sucesso
    #if: ${{ github.event.workflow_run.conclusion == 'success' }}

    #passos do job
    steps:
      #clone do projeto
      - uses: actions/checkout@v4

      #instalação do node
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      #instalação do Yarn
      - name: Instalando o Yarn
        run: npm install -g yarn

      #instalação das dependências
      - name: Instalando dependências
        run: yarn

      #instalação do browser do playwright
      - name: Instalando o browser do Playwright
        run: npx playwright install --with-deps

      #execução dos testes e2e
      - name: Executando os testes e2e
        run: yarn run e2e

      - name: Salvando relatórios de testes
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          path: ./playwright-report
          name: Relatório de Testes E2E
